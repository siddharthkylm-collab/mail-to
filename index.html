<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handle With Care</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --ink: #f8f4e8;
      --muted: #9da09a;
      --acid: #dfff4f;
      --coral: #ff6d4d;
      --night: #111412;
      --panel: #1a1e1b;
      --line: rgba(248, 244, 232, .14);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--night);
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
      background:
        linear-gradient(rgba(248, 244, 232, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(248, 244, 232, .035) 1px, transparent 1px),
        radial-gradient(circle at 50% 48%, #29302a 0%, #171b18 40%, #0d100e 100%);
      background-size: 42px 42px, 42px 42px, auto;
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .15;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");
    }

    .topbar {
      position: absolute;
      top: 34px;
      left: 52px;
      right: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font: 500 11px 'DM Mono', monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand { color: var(--acid); }
    .status { display: flex; align-items: center; gap: 9px; }
    .status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 15px var(--acid);
    }

    .content {
      width: min(720px, calc(100% - 40px));
      text-align: center;
      transform: translateY(10px);
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--acid);
      font: 500 11px 'DM Mono', monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6.7rem);
      line-height: .87;
      letter-spacing: -.075em;
      font-weight: 700;
    }

    .intro {
      max-width: 410px;
      margin: 24px auto 35px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .bomb-button {
      position: relative;
      width: 250px;
      height: 250px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      filter: drop-shadow(0 28px 25px rgba(0, 0, 0, .45));
      transition: transform .2s ease, filter .2s ease;
    }

    .bomb-button:hover { transform: translateY(-7px) rotate(-2deg); filter: drop-shadow(0 34px 28px rgba(0, 0, 0, .55)); }
    .bomb-button:focus-visible { outline: 3px solid var(--acid); outline-offset: 8px; }

    .bomb {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 33% 25%, #626963 0 4%, #333a36 22%, #171b19 67%, #090b0a 100%);
      border: 2px solid #6e766f;
      box-shadow: inset -18px -22px 25px rgba(0,0,0,.6), inset 16px 11px 15px rgba(255,255,255,.08), 8px 10px 0 #080a09;
    }

    .bomb::before, .bomb::after {
      content: '';
      position: absolute;
      background: #111513;
      border-radius: 50%;
    }

    .bomb::before { width: 16px; height: 16px; top: 37%; left: 26%; box-shadow: 89px 33px 0 #111513, 61px 75px 0 #111513, 22px 91px 0 #111513; }
    .bomb::after { width: 7px; height: 7px; top: 20%; left: 57%; box-shadow: -54px 79px 0 #454c47, 72px 14px 0 #454c47; }

    .fuse {
      position: absolute;
      z-index: 2;
      width: 60px;
      height: 54px;
      top: -6px;
      right: 34px;
      border-top: 9px solid #262d29;
      border-right: 9px solid #262d29;
      border-radius: 0 35px 0 0;
      transform: rotate(15deg);
    }

    .spark {
      position: absolute;
      z-index: 3;
      top: -17px;
      right: 21px;
      width: 27px;
      height: 27px;
      color: var(--coral);
      font-size: 34px;
      line-height: 1;
      animation: flicker 1.3s infinite ease-in-out;
    }

    .fuse-caption {
      position: absolute;
      left: 50%;
      bottom: 9px;
      transform: translateX(-50%);
      color: rgba(248,244,232,.45);
      font: 500 10px 'DM Mono', monospace;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hint {
      margin-top: 27px;
      color: var(--acid);
      font: 500 11px 'DM Mono', monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
      animation: breathe 2.2s infinite ease-in-out;
    }

    .countdown {
      display: none;
      margin-top: 23px;
      color: var(--coral);
      font: 500 13px 'DM Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .countdown strong { display: inline-block; min-width: 2ch; color: var(--ink); font-size: 24px; }
    .stage.armed .bomb-button { animation: tremble .16s infinite; cursor: wait; }
    .stage.armed .hint { display: none; }
    .stage.armed .countdown { display: block; }

    .reveal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity .7s ease, visibility .7s ease;
    }

    .reveal-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0d100e; transform: scale(.9); }
    body.revealed .reveal { visibility: visible; opacity: 1; animation: flash-pop .72s ease-out both; }

    @keyframes flicker { 0%, 100% { transform: scale(.8) rotate(-8deg); opacity: .75; } 50% { transform: scale(1.18) rotate(12deg); opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes tremble { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(2px, -1px) rotate(-1deg); } 100% { transform: translate(-2px, 1px) rotate(1deg); } }
    @keyframes flash-pop { 0% { filter: brightness(2.8); transform: scale(1.08); } 42% { filter: brightness(1.25); transform: scale(1.015); } 100% { filter: brightness(1); transform: scale(1); } }

    @media (max-width: 600px) {
      .topbar { top: 25px; left: 30px; right: 30px; }
      .topbar .status { display: none; }
      .content { transform: translateY(15px); }
      .intro { margin-top: 19px; margin-bottom: 26px; font-size: 14px; }
      .bomb-button { width: 205px; height: 205px; }
      .bomb { inset: 16px; }
      .fuse { right: 26px; }
      .reveal { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="grain"></div>
    <div class="topbar"><span class="brand">HC / 001</span><span class="status">system armed · handle with care</span></div>
    <section class="content" aria-live="polite">
      <p class="eyebrow">A tiny test of courage</p>
      <h1>DON'T<br>TOUCH.</h1>
      <p class="intro">There is absolutely nothing interesting hidden inside this perfectly ordinary little device.</p>
      <button class="bomb-button" id="bomb" aria-label="Click the bomb to start the countdown">
        <span class="fuse"></span><span class="spark">✦</span>
        <span class="bomb"></span>
        <span class="fuse-caption">click at your own risk</span>
      </button>
      <div class="hint">[ click the bomb ]</div>
      <div class="countdown" id="countdown">surprise in <strong id="seconds">3</strong></div>
    </section>
  </main>

  <section class="reveal" id="reveal" aria-hidden="true">
    <video class="reveal-video" id="revealVideo" preload="auto" playsinline>
      <source src="surprise-video-trimmed.mp4" type="video/mp4">
    </video>
    <audio id="revealAudio" preload="auto" src="new-surprise-audio-trimmed.mp3" type="audio/mpeg"></audio>
  </section>

  <script>
    const stage = document.getElementById('stage');
    const bomb = document.getElementById('bomb');
    const seconds = document.getElementById('seconds');
    const revealVideo = document.getElementById('revealVideo');
    const revealAudio = document.getElementById('revealAudio');
    let timer;

    bomb.addEventListener('click', () => {
      if (stage.classList.contains('armed')) return;
      stage.classList.add('armed');
      let remaining = 3;
      seconds.textContent = remaining;
      timer = setInterval(() => {
        remaining -= 1;
        seconds.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          document.body.classList.add('revealed');
          document.getElementById('reveal').setAttribute('aria-hidden', 'false');
          revealVideo.currentTime = 0;
          revealVideo.muted = true;
          revealVideo.play().catch(() => {});
          revealAudio.currentTime = 0;
          revealAudio.volume = 1;
          revealAudio.play().catch(() => {});
        }
      }, 1000);
    });

  </script>
</body>
</html>
